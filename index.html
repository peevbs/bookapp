<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">

<title>Рафт</title>
<style>
/* Layout: one column, catalogue-card detail view, sticky add button at the bottom of the shelf. */
:root{
  --bg:#f2f3ef; --surface:#fbfbf9; --ink:#18222b; --muted:#5b6872; --line:#d3d8d2;
  --accent:#27698a; --accent-ink:#ffffff; --accent-soft:#dcebf2;
  --ok:#2b7a4b; --ok-soft:#dcefe3; --warn:#9a5d12; --warn-soft:#f4e6cf; --bad:#b0352d; --bad-soft:#f6dedb;
  --serif:"Noto Serif","Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12171c; --surface:#1a2128; --ink:#e7eaea; --muted:#95a2aa; --line:#2b353d;
    --accent:#6db4d4; --accent-ink:#0a1a23; --accent-soft:#1d3340;
    --ok:#6cc58d; --ok-soft:#1b3326; --warn:#e0a458; --warn-soft:#3a2d17; --bad:#ee8a82; --bad-soft:#3d1f1c;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); font:16px/1.45 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:720px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:12px;padding:18px 0 10px}
.top h1{font-size:28px;letter-spacing:.01em;flex:1}
.top .count{color:var(--muted);font-size:14px}
.back{border:0;background:none;padding:8px 10px 8px 0;color:var(--accent);font-weight:600;cursor:pointer}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.btn.block{width:100%}

.tools{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin:4px 0 14px}
.search{width:100%;min-width:0;min-height:44px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.srow{display:flex;gap:8px;align-items:stretch}
.srow .search{flex:1}
.srow.btns .fbtn{flex:1;justify-content:center}
.fbadge.ok{background:var(--ok)}
.rtab{display:grid;gap:6px;margin:6px 0 12px}
.rrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:inherit;color:inherit}
button.rrow{cursor:pointer}
.rd{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.rt{display:grid;gap:1px;min-width:0}
.rt b{font:600 15px/1.25 var(--serif);overflow-wrap:anywhere}
.rt span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.rs{color:#c58a00;font-size:12px;white-space:nowrap}
#yrs{margin-bottom:6px}
.fbtn{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:15px;white-space:nowrap}
.fbtn[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fbadge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;display:grid;place-items:center}
.fpanel{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.pill.pick{cursor:pointer}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sheet .in{width:100%;max-width:720px;margin:0 auto;background:var(--surface);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px));border-radius:16px 16px 0 0;display:grid;gap:8px}
.sheet .sh{font:600 16px var(--serif);margin-bottom:4px;overflow-wrap:anywhere}
.fpanel[hidden]{display:none}
.fpanel{min-width:0;grid-template-columns:minmax(0,1fr)}
.fpanel>*{min-width:0}
.fpanel .chips{flex-wrap:wrap;overflow:visible}
.fpanel .sortrow select{min-width:0;width:100%}
.flab{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:-4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;min-height:36px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sortrow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.sortrow label{white-space:nowrap;min-width:84px}
.sortrow select{flex:1;min-width:0;min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px 8px}

.list{display:grid;gap:10px}
.list.grid2{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.list.grid3{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
.grp{grid-column:1/-1;font:600 15px var(--serif);color:var(--muted);margin:10px 0 0;padding-bottom:4px;border-bottom:1px solid var(--line)}
.bk{display:grid;gap:6px;align-content:start;text-align:left;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;min-width:0}
.bk .cover{width:100%;height:auto;aspect-ratio:2/3;border-radius:3px 8px 8px 3px}
.bk .spine{font-size:40px}
.bk .ct{font:600 15px/1.25 var(--serif);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bk .ca{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.grid3 .bk{padding:6px;gap:4px}
.grid3 .bk .ct{font-size:12.5px;-webkit-line-clamp:2}
.grid3 .bk .spine{font-size:30px}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.cover{width:56px;height:84px;border-radius:3px 6px 6px 3px;overflow:hidden;display:block;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.spine{width:100%;height:100%;display:grid;place-items:center;color:#fff;font:600 26px var(--serif);border-left:6px solid rgba(0,0,0,.25)}
.meta{display:grid;gap:2px;min-width:0}
.meta .t{font:600 17px/1.25 var(--serif);overflow-wrap:anywhere}
.meta .a{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.meta .o,.head .o{color:var(--muted);font:italic 14px/1.3 var(--serif);overflow-wrap:anywhere}
.meta .p{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.s-to_read{background:var(--accent-soft);color:var(--accent)}
.s-reading{background:var(--warn-soft);color:var(--warn)}
.s-read{background:var(--ok-soft);color:var(--ok)}

.empty{padding:28px 4px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:20px;margin-bottom:8px}
.foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(to top,var(--bg) 70%,transparent);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .btn{max-width:720px;margin:0 auto;display:flex}

.note{padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:14px;margin:10px 0}
.note.warn{background:var(--warn-soft)}
.note.bad{background:var(--bad-soft)}
.note.ok{background:var(--ok-soft)}
.note button{margin-left:6px}

.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.slot{border:1px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;justify-items:center;background:var(--surface)}
.slot h3{font-size:15px}
.slot .shot{width:100px;height:140px;border-radius:4px;background:var(--bg);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;overflow:hidden}
.slot .shot img{width:100%;height:100%;object-fit:cover}
.slot .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
label.field{display:grid;gap:6px;font-size:14px;color:var(--muted);margin:12px 0}
.cand{display:grid;gap:2px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.cand.best{border-color:var(--accent)}
.cand .badge{justify-self:start;margin:0 0 4px}
.cand .t{font:600 17px/1.25 var(--serif);overflow-wrap:anywhere}
.cand .a{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.cand .p{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.slot .st{font-size:12px;color:var(--muted);text-align:center;min-height:1.2em;overflow-wrap:anywhere}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:14px}
.chk input{width:20px;height:20px;margin-top:2px;flex:none}
label.field input{min-height:44px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

.working{display:grid;gap:14px;justify-items:center;padding:48px 0;text-align:center}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none;border-top-color:var(--line)}}

.upd{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg);font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.upd span{flex:1}
.covcol{display:grid;gap:6px;justify-items:center}
.head{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:end;margin:6px 0 14px}
.head .cover{width:96px;height:144px}
.head .spine{font-size:40px}
.head h2{font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.badge{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.b-high{background:var(--ok-soft);color:var(--ok)}
.b-medium{background:var(--warn-soft);color:var(--warn)}
.b-low{background:var(--bad-soft);color:var(--bad)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 16px;margin:12px 0}
.f{display:grid;grid-template-columns:minmax(96px,34%) minmax(0,1fr);gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px dotted var(--line)}
.f:last-child{border-bottom:0}
.f label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere;hyphens:auto;min-width:0}
.f input,.f select,.f textarea{width:100%;border:0;background:transparent;padding:4px 0;color:var(--ink);font-family:var(--serif);font-size:16px;min-width:0}
.f textarea{resize:vertical;min-height:84px;font-family:var(--sans);font-size:15px;line-height:1.45}
.f textarea.ac{min-height:0;overflow:hidden;resize:none;font-family:var(--serif);font-size:16px;line-height:1.35;display:block}
.f.wide{grid-template-columns:1fr}
a{color:var(--accent)}
.f select{font-family:var(--sans)}
.pick{display:grid;gap:6px;min-width:0}
.paste{padding:12px 16px}
.paste textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px;font:14px/1.4 var(--sans)}
.paste .chk span{overflow-wrap:anywhere}
.pick select{min-height:40px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--serif);text-overflow:ellipsis}
.pick .newv{min-height:40px;padding:6px 8px;border:1px solid var(--accent);border-radius:8px;background:var(--surface)}
.pick .newv[hidden]{display:none}
.cv{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line)}
.cv:last-child{border-bottom:0}
.cv img{width:44px;height:66px;object-fit:cover;border-radius:2px;display:block}
.cv .rot{position:relative;border:0;padding:0;background:none;cursor:pointer}
.cv .rot span{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:14px;line-height:22px;text-align:center}
.cv .fn{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.cv select{width:100%;min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:4px 6px;font-size:14px}
.srcs{display:grid;gap:6px;font-size:14px;margin:8px 0}
.srcs a{color:var(--accent);overflow-wrap:anywhere}
.diag{margin:10px 0;font-size:14px}
.diag summary{cursor:pointer}
.diag ul,.diagl{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
.links .btn{flex:1 1 140px;text-decoration:none}
.vchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 10px;grid-column:1/-1}.vchips .chip{font-size:13px;text-align:left}
.acts2.tight{margin:10px 0}
.zoomable{cursor:zoom-in}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
.zoom img{max-width:94vw;max-height:94vh;border-radius:4px}
.acts2{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.acts2 .btn{flex:1 1 140px}
h3.sec{font-size:16px;margin:22px 0 6px}
.small{font-size:13px;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
</style>

<main id="app" aria-live="polite"></main>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';

/* PURE:START — no DOM, no network; covered by tests */
const STATUS = { to_read: 'За четене', read: 'Прочетена' };   // "currently reading" counts as to read
/* The first 18 are the columns of the owner's spreadsheet, in its order; "Бележки" (notes) follows them. */
const FIELDS = [
  ['title', 'Заглавие'], ['original_title', 'Оригинално заглавие'], ['author', 'Автор'], ['translator', 'Преводач'], ['isbn', 'ISBN'],
  ['publisher', 'Издателство'], ['genre', 'Жанр'], ['series', 'Поредица'], ['series_no', 'Номер в поредицата'], ['binding', 'Подвързия'],
  ['pages', 'Брой страници'], ['illustrator', 'Илюстратор'], ['language', 'Език'], ['country', 'Държава'],
  ['year', 'Година на издание'], ['size', 'Размер (мм)'], ['printer', 'Печат'], ['location', 'Местоположение на съхранение'],
  ['volume', 'Том'], ['editor', 'Редактор'], ['cover_artist', 'Художник на корицата']
];
const TABLE_N = 18;                                   // fields before the extras
/* The two shelves. A book saved earlier with another value keeps it (shown as an extra option). */
const LOCATIONS = ['Библиотека с класика в коридора', 'Библиотека със съвременни романи в хола'];
/* Drop-down fields: values already in the library, "none" and "add new". */
const PICK_FIELDS = ['series', 'printer', 'binding', 'language', 'country', 'size'];
const COPY_FROM_PUBLISHER = ['series', 'binding', 'size', 'printer', 'location', 'language'];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function isbn13Valid(d) {
  if (!/^\d{13}$/.test(d)) return false;
  let s = 0;
  for (let i = 0; i < 12; i++) s += (+d[i]) * (i % 2 ? 3 : 1);
  return (10 - (s % 10)) % 10 === +d[12];
}
function isbn10Valid(d) {
  if (!/^\d{9}[\dXx]$/.test(d)) return false;
  let s = 0;
  for (let i = 0; i < 10; i++) s += (i === 9 && /x/i.test(d[i]) ? 10 : +d[i]) * (10 - i);
  return s % 11 === 0;
}
function isbn10to13(d) {
  const b = '978' + d.slice(0, 9);
  let s = 0;
  for (let i = 0; i < 12; i++) s += (+b[i]) * (i % 2 ? 3 : 1);
  return b + ((10 - (s % 10)) % 10);
}
/* Returns a valid ISBN-13 (digits only) or ''. */
function normIsbn(raw) {
  const d = String(raw || '').replace(/[\s-]/g, '');
  if (isbn13Valid(d)) return d;
  if (isbn10Valid(d)) return isbn10to13(d);
  return '';
}
function parseJsonLoose(text) {
  const s = String(text || '');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b <= a) return null;
  try { return JSON.parse(s.slice(a, b + 1)); } catch (e) { return null; }
}
function cleanStr(v) {
  if (v == null) return '';
  const s = String(v).trim();
  return /^(null|n\/a|unknown|няма|—|-)$/i.test(s) ? '' : s;
}
function cleanNum(v) {
  const n = parseInt(String(v == null ? '' : v).replace(/\D/g, ''), 10);
  return Number.isFinite(n) && n > 0 ? String(n) : '';
}
function safeUrl(u) {
  try { const x = new URL(String(u)); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; }
}
function urlKey(u) {
  const s = safeUrl(u);
  return s ? s.replace(/#.*$/, '').replace(/\/+$/, '').toLowerCase() : '';
}
/* Collects text, search queries and every URL the API actually returned. */
function collect(blocks) {
  const texts = [], queries = [], urls = new Set();
  let final = [];                        // text after the last tool block = the answer itself
  for (const b of blocks || []) {
    if (b.type !== 'text') final = [];
    if (b.type === 'text') {
      texts.push(b.text || '');
      final.push(b.text || '');
      for (const c of b.citations || []) if (c.url) urls.add(urlKey(c.url));
    } else if (b.type === 'server_tool_use' && b.input && b.input.query) {
      queries.push(b.input.query);
    } else if (b.type === 'web_search_tool_result' && Array.isArray(b.content)) {
      for (const r of b.content) if (r.url) urls.add(urlKey(r.url));
    }
  }
  urls.delete('');
  return { texts, queries, urls, final: final.join('') };
}
/* Turns the model's JSON into a book. Sources and links that were never seen in the search are dropped. */
function bookFromModel(obj, seenUrls) {
  const o = obj || {};
  const isbnRaw = cleanStr(o.isbn);
  const isbn = normIsbn(isbnRaw) || isbnRaw;
  const sources = [];
  for (const s of Array.isArray(o.sources) ? o.sources : []) {
    const href = safeUrl(s && s.url);
    if (href && seenUrls.has(urlKey(href)) && !sources.some(x => x.url === href)) {
      sources.push({ title: cleanStr(s.title) || new URL(href).hostname, url: href });
    }
    if (sources.length >= 5) break;
  }
  const conf = ['high', 'medium', 'low'].includes(o.confidence) ? o.confidence : 'low';
  return {
    title: cleanStr(o.title), original_title: cleanStr(o.original_title), author: cleanStr(o.author), translator: cleanStr(o.translator),

async function scaled(bmp, max, q) {
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);

/* Every cover ends up the same shape and size (2:3, 480 x 720), so the shelf looks even.
   The whole photo is kept (nothing of the book is cut off) and centred; the empty sides are filled
   with a blurred, darkened copy of the same photo. turns = quarter turns clockwise (for a sideways photo). */
const COVER_W = 480, COVER_H = 720;

  turns = ((turns || 0) % 4 + 4) % 4;

  const g = c.getContext('2d'); g.translate(c.width / 2, c.height / 2); g.rotate(turns * Math.PI / 2);

}
async function coverImages(bmp, turns) {
  const src = rotated(bmp, turns);

    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');

    g.fillStyle = '#20262c'; g.fillRect(0, 0, W, H);

    g.drawImage(src, (W - src.width * kc) / 2, (H - src.height * kc) / 2, src.width * kc, src.height * kc);
    g.filter = 'none';
    g.drawImage(src, (W - src.width * kf) / 2, (H - src.height * kf) / 2, src.width * kf, src.height * kf);
    return c.toDataURL('image/jpeg', q);

}

async function zxingScan(bmp) {
  try {
    if (!window.ZXing) await loadScript('vendor/zxing.min.js');
    for (const max of [2000, 1200]) {
      const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

      try {
        const res = reader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c))));
        const v = normIsbn(res.getText()); if (v) return v;
      } catch (e) { /* nothing readable at this size */ }
    }
  } catch (e) { /* decoder not available */ }
  return '';
}
async function scanBarcode(bmp) {
  if ('BarcodeDetector' in window) {
    try {
      const det = new BarcodeDetector({ formats: ['ean_13', 'upc_a'] });
      for (const f of await det.detect(bmp)) { const v = normIsbn(f.rawValue); if (v) return v; }
    } catch (e) { /* fall through to ZXing */ }
  }
  return zxingScan(bmp);
}

    const w = await Tesseract.createWorker(['bul', 'eng'], 1, {
      workerPath: abs('vendor/worker.min.js'), corePath: abs('vendor/core'), langPath: abs('vendor/tessdata'), gzip: true,
      logger: m => ocrLog && ocrLog(m)
    });

    return w;
  })().catch(e => { ocrReady = null; throw e; });

}
function ocrRun(dataUrl, onStatus) {

    const lines = [];
    for (const b of r.data.blocks || []) for (const p of b.paragraphs || []) for (const l of p.lines || []) {
      lines.push({ t: String(l.text || '').trim(), conf: Math.round(l.confidence || 0) });

  });

}

async function fillOriginals(btn, out) {

  const todo = books.filter(b => normIsbn(b.isbn) && !String(b.original_title || '').trim());
  if (!todo.length) { out.innerHTML = '<div class="note">Няма книги с ISBN и празно оригинално заглавие.</div>'; return; }
  origCtl = new AbortController(); btn.textContent = 'Спри';
  let found = 0, i = 0;
  try {
    for (const b of todo) {
      i++; out.innerHTML = '<div class="note">Проверявам ' + i + ' от ' + todo.length + ': ' + esc(b.title) + ' (намерени: ' + found + ')</div>';
      const t = await olOriginal(normIsbn(b.isbn), b.title, origCtl.signal);
      if (!t) continue;
      const old = (await dbAll()).find(x => x.id === b.id);
      if (old && !String(old.original_title || '').trim()) { await dbPut(Object.assign({}, old, { original_title: t, updatedAt: Date.now() })); found++; }
    }
    out.innerHTML = '<div class="note ok">Готово: попълнени ' + found + ' от ' + todo.length + '. За останалите в Open Library няма оригинално заглавие.</div>';
  } catch (e) {
    out.innerHTML = e && e.name === 'AbortError' ? '<div class="note">Спряно. Попълнени: ' + found + '.</div>' : '<div class="note bad">Прекъсна: няма връзка или записът не успя. Попълнени: ' + found + '.</div>';

    origCtl = null; btn.textContent = 'Попълни липсващите';
    books = await dbAll().catch(() => books);
  }
}

      out.innerHTML = '<div class="note"><b>От Goodreads:</b> ' + grLog.length + ' прочетени произведения общо.<ul class="diagl"><li>Книги от Рафта, които ще се маркират или ще получат дата: ' + todo.length + '</li><li>Вече наред: ' + done.length + '</li>' +
        (todo.length ? '<li>' + esc(todo.map(b => b.title).join('; ')) + '</li>' : '') + '</ul></div>' +
        '<div class="acts2"><button class="btn primary" id="bDoGr"' + (todo.length ? '' : ' disabled') + '>Маркирай</button><button class="btn" id="bNoGr">Отказ</button></div>';
      $('#bNoGr').onclick = () => { out.innerHTML = ''; };
      $('#bDoGr').onclick = async () => {
        try { for (const b of todo) await dbPut(Object.assign({}, b, { status: 'read', updatedAt: Date.now(), readDate: b.readDate || dateOf.get(keyTA(b)) || '' })); books = await dbAll(); out.innerHTML = '<div class="note ok">Готово: ' + todo.length + ' книги са „Прочетена“.</div>'; }
        catch (err) { out.innerHTML = '<div class="note bad">Не завърши. Провери дали има свободно място и опитай пак.</div>'; }
      };
    } catch (err) { out.innerHTML = '<div class="note bad">Не успях да взема списъка от сайта. Провери връзката и опитай пак.</div>'; }
    btn.disabled = false;
  };
  $('#bGhCov').onclick = async () => {
    const btn = $('#bGhCov'), out = $('#covGh'); btn.disabled = true; out.innerHTML = '<p class="small">Свалям корици…</p>';
    try {
      const r = await fetch('covers.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('http ' + r.status);
      const list = await r.json();
      try {   /* covers photographed later and pushed by the phone */
        const lr = await fetch('https://api.github.com/repos/' + getSettings().ghRepo + '/contents/covers/new?ref=main', { cache: 'no-store' });
        if (lr.ok) for (const f of await lr.json()) {
          if (!/\.json$/.test(f.name)) continue;
          try { const x = await (await fetch('covers/new/' + f.name + '?t=' + Date.now(), { cache: 'no-store' })).json(); if (x && x.thumb) list.unshift(x); } catch (e) { /* skip one */ }
        }
      } catch (e) { /* optional */ }
      const cur = await dbAll(); let set = 0, had = 0, miss = 0;
      for (const b of cur) {
        if (b.thumb) { had++; continue; }
        const c = list.find(x => x.thumb && sameBook(b, x));
        if (c) { await dbPut(Object.assign({}, b, { thumb: c.thumb })); set++; } else miss++;
      }
      books = await dbAll();
      out.innerHTML = '<div class="note ok">Готово: корици добавени на ' + set + ' книги. Вече имаха корица: ' + had + '. Без съвпадение в сайта: ' + miss + '.</div>';
    } catch (err) { out.innerHTML = '<div class="note bad">Не успях да взема кориците от сайта. Провери връзката и опитай пак.</div>'; }
    btn.disabled = false;
  };
  $('#bArchive').onclick = async () => {
    try {
      const text = await makeArchive(), n = JSON.parse(text).count;
      await saveFile('raft-arhiv-' + stamp() + '.json', 'application/json', text);
      setBackupMeta(n); toast('Архивът е готов: ' + n + ' книги.');
      const i = $('#bkInfo'); if (i) i.textContent = 'Последен архив: днес, ' + n + ' книги.';
    } catch (e) { toast('Архивът не се запази.'); }
  };
  $('#impA').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const out = $('#restoreOut');
    try {
      const text = await f.text(), pa = parseArchive(text);
      if (!pa.ok) { out.innerHTML = '<div class="note bad">' + esc(pa.error) + '</div>'; return; }
      if (pa.sha) { const got = await sha256hex(JSON.stringify(pa.rawBooks)); if (got && got !== pa.sha) { out.innerHTML = '<div class="note bad">Архивът е повреден: контролната сума не съвпада. Не го възстановявам.</div>'; return; } }
      const plan = planRestore(await dbAll(), pa.books);
      out.innerHTML = '<div class="note"><b>Архив' + (pa.exportedAt ? ' от ' + esc(pa.exportedAt.slice(0, 10)) : '') + ':</b> ' + pa.books.length + ' книги.<ul class="diagl">' +
        '<li>Нови: ' + plan.add.length + '</li><li>По-нови от тези при теб (ще се обновят): ' + plan.update.length + '</li>' +
        '<li>Вече същите: ' + plan.same + '</li><li>При теб са по-нови или без дата (остават): ' + plan.keepLocal + '</li>' +
        (pa.invalid ? '<li>Невалидни записи, пропуснати: ' + pa.invalid + '</li>' : '') + (pa.countMismatch ? '<li>Броят в архива не съвпада с книгите в него.</li>' : '') + '</ul></div>' +
        '<div class="acts2"><button class="btn primary" id="bDoRestore"' + (plan.add.length + plan.update.length ? '' : ' disabled') + '>Възстанови</button><button class="btn" id="bNoRestore">Отказ</button></div>';
      $('#bNoRestore').onclick = () => { out.innerHTML = ''; };
      $('#bDoRestore').onclick = async () => {
        try {
          for (const b of plan.add.concat(plan.update)) await dbPut(b);
          books = await dbAll(); out.innerHTML = '<div class="note ok">Готово: добавени ' + plan.add.length + ', обновени ' + plan.update.length + '.</div>';
        } catch (err) { out.innerHTML = '<div class="note bad">Възстановяването не завърши. Провери дали има свободно място и опитай пак.</div>'; }
      };
    } catch (err) { out.innerHTML = '<div class="note bad">Файлът не може да се прочете.</div>'; }
  };
  (async () => {
    try {
      const per = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null;
      const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null;
      const el = $('#storInfo'); if (!el) return;
      el.textContent = 'Хранилище: ' + (per === true ? 'защитено от автоматично изчистване' : per === false ? 'не е защитено от автоматично изчистване, затова правилният архив е важен' : 'състоянието е неизвестно') +
        (est && est.usage != null ? '. Използвано: ' + (est.usage / 1048576).toFixed(1) + ' MB.' : '.');
    } catch (e) { /* informational */ }
  })();
}

/* ---------- start ---------- */
(async function init() {
  history.replaceState({ v: 'library' }, '');
  try { books = await dbAll(); } catch (e) { toast('Хранилището не е достъпно в този режим на браузъра.'); }
  try {   /* one-time clean-up of series saved in Latin letters */
    for (const b of books) { const f = fixSeries(b.series), st = b.status === 'reading' ? 'to_read' : b.status; if (f !== (b.series || '') || st !== b.status) await dbPut(Object.assign({}, b, { series: f, status: st })); }
    books = await dbAll();
  } catch (e) { /* not critical */ }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* best effort */ }
  renderLibrary();
  ghFlush(true); checkUpdate(false);
  loadGrLog().then(ok => { if (ok && document.getElementById('bRead')) { const bf = document.activeElement && document.activeElement.id === 'q'; if (!bf) renderLibrary(); } });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
